spring.application.name=Madar





spring.datasource.url=jdbc:mysql://localhost:3306/madar
spring.datasource.username=root
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect




spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

spring.web.error.include-message=always
spring.web.error.include-stacktrace=always

# ========================================
# HTTP Clients
# ========================================
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=20s

# ========================================
# Kite - Saudi Real Estate Listings
# ========================================
kite.base-url=https://api.kite.sa/v1
kite.api-key=${KITE_API_KEY}

# ========================================
# Google Maps Platform
# ========================================
google.api-key=${GOOGLE_MAPS_API_KEY}
google.routes-url=https://routes.googleapis.com
google.places-url=https://places.googleapis.com

# ========================================
# OpenRouter
# ========================================
spring.ai.model.chat=openai
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.model=${OPENROUTER_MODEL:google/gemini-2.5-flash}

# ========================================
# Moyasar
# ========================================

moyasar.api-key=${MOYASAR_SECRET_KEY}
moyasar.base-url=https://api.moyasar.com/v1
moyasar.callback-url=${MOYASAR_CALLBACK_URL:http://localhost:3000/ar/payments/return}
moyasar.webhook-secret=${MOYASAR_WEBHOOK_SECRET:}

# Provisional consumer pricing: 9 SAR, 24 hours of personalized commute analysis.
madar.paid-services.services[COMMUTE_REPORT].enabled=${COMMUTE_REPORT_ENABLED:true}
madar.paid-services.services[COMMUTE_REPORT].amount-halalas=${COMMUTE_REPORT_PRICE_HALALAS:900}
madar.paid-services.services[COMMUTE_REPORT].currency=SAR
madar.paid-services.services[COMMUTE_REPORT].access-hours=${COMMUTE_REPORT_ACCESS_HOURS:24}

# JWT Configuration
app.jwt.secret=${JWT_SECRET}

# Password Reset Configuration
app.security.password-reset-secret=${PASSWORD_RESET_SECRET}
